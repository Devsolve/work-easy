name: Frontend CI
on:
  push:
    paths:
      - 'frontend-react/**'
  pull_request:
    paths:
      - 'frontend-react/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
        working-directory: frontend-react
      - name: Lint
        run: npm run lint
        working-directory: frontend-react
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend-react
      - name: Test
        run: npm test -- --run
        working-directory: frontend-react
      - name: Build
        run: npm run build
        working-directory: frontend-react