name: Backend CI
on:
  push:
    paths:
      - 'python-backend/**'
  pull_request:
    paths:
      - 'python-backend/**'
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: work_easy_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: python-backend
      - name: Lint
        run: |
          black --check .
          flake8 .
        working-directory: python-backend
      - name: Test
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/work_easy_test
        run: pytest -q
        working-directory: python-backend